# ===== /orca_auv/bottom_camera_pid_bridge_node =====
/orca_auv/bottom_camera_pid_bridge_node:
  ros__parameters:
    max_force_x_N: 10.0
    max_force_y_N: 10.0
    max_yaw_torque_Nm: 5.0
    output_topic: control/wrench_sources/bottom_camera
    use_sim_time: false
    x_manipulated_topic: control/pid/bottom_camera/x/force_world_N
    y_manipulated_topic: control/pid/bottom_camera/y/force_world_N
    yaw_manipulated_topic: control/pid/bottom_camera/yaw/torque_Nm
    yaw_topic: state/bottom_camera/yaw_rad

# ===== /orca_auv/depth_pid_controller_node =====
/orca_auv/depth_pid_controller_node:
  ros__parameters:
    controller_loop_timer_period_s: 0.01
    derivative_gain: 12.0
    derivative_smoothing_factor: 0.0
    integral_gain: 3.0
    proportional_gain: 40.0
    use_sim_time: false

# ===== /orca_auv/float32_to_float64_converter_node =====
/orca_auv/float32_to_float64_converter_node:
  ros__parameters:
    use_sim_time: false

